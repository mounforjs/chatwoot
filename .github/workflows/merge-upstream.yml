name: Manual Merge Remote Action
on: 
  workflow_dispatch:
    inputs:
      upstream:
        description: 'Upstream repository chatwoot/chatwoot'
        required: true
        default: 'chatwoot/chatwoot'       
      upstream:
        description: 'Upstream branch to merge from. Eg. master'
        required: true
        default: 'develop'           
      branch:
        description: 'Branch to merge to'
        required: true
        default: 'develop'         